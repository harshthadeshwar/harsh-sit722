name: stage-1-2 (testing) tests→build→ACR

on:
  push:
    branches: ["testing"]

permissions:
  contents: read

env:
  REGISTRY: harshsit722acr.azurecr.io
  IMAGE_TAG: testing-${{ github.run_number }}
  AZURE_RG: rg-sit722-harsh
  LOCATION: australiaeast

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system libs + Python deps (all requirements*.txt)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client libpq-dev gcc
          pip install --upgrade pip
          find backend -maxdepth 2 -type f -iname "requirements*.txt" -print0 | \
            xargs -0 -I {} sh -c 'echo "Installing: {}"; pip install -r "{}"'
          pip install pytest httpx pytest-asyncio
      - name: Create test databases
        run: |
          psql -h $PGHOST -U $PGUSER -c "CREATE DATABASE product_db;"
          psql -h $PGHOST -U $PGUSER -c "CREATE DATABASE order_db;"
          psql -h $PGHOST -U $PGUSER -c "CREATE DATABASE customer_db;"
      - name: Test product_service
        working-directory: backend/product_service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: product_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/product_db
          ENV: TEST
          TESTING: "1"
          DISABLE_STARTUP: "1"
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          SQLALCHEMY_SILENCE_UBER_WARNING: "1"
          PYTHONPATH: .
        run: pytest -q
      - name: Test order_service
        working-directory: backend/order_service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: order_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/order_db
          ENV: TEST
          TESTING: "1"
          DISABLE_STARTUP: "1"
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          SQLALCHEMY_SILENCE_UBER_WARNING: "1"
          PYTHONPATH: .
        run: pytest -q
      - name: Test customer_service
        working-directory: backend/customer_service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: customer_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_db
          ENV: TEST
          TESTING: "1"
          DISABLE_STARTUP: "1"
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          SQLALCHEMY_SILENCE_UBER_WARNING: "1"
          PYTHONPATH: .
        run: pytest -q

  build_and_push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      - name: Build product_service
        run: docker build -t $REGISTRY/product_service:${IMAGE_TAG} backend/product_service
      - name: Build order_service
        run: docker build -t $REGISTRY/order_service:${IMAGE_TAG} backend/order_service
      - name: Build customer_service
        run: docker build -t $REGISTRY/customer_service:${IMAGE_TAG} backend/customer_service
      - name: Build frontend
        run: docker build -t $REGISTRY/frontend:${IMAGE_TAG} -f frontend/Dockerfile frontend
      - name: Push images
        run: |
          for IMG in product_service order_service customer_service frontend; do
            docker push $REGISTRY/$IMG:${IMAGE_TAG}
          done
      - name: Tag+push frontend:latest
        run: |
          docker tag $REGISTRY/frontend:${IMAGE_TAG} $REGISTRY/frontend:latest
          docker push $REGISTRY/frontend:latest
